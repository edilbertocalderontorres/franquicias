server:
  port: 8080
spring:
  application:
    name: "franquicias-reactivo"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  web:
    resources:
      # Sirve applications/app-service/src/main/resources/static/openapi.yml en /openapi.yml
      static-locations: "classpath:/static/"
management:
  endpoints:
    web:
      exposure:
        include: "health"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
adapters:
  r2dbc:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    database: ${DB_NAME:franquicias}
    schema: ${DB_SCHEMA:public}
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:app}
