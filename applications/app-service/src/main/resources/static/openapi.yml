openapi: 3.0.3
info:
  title: Franquicias API
  description: >
    API reactiva para administrar franquicias, sus sucursales y los productos
    ofertados en cada una, incluyendo control de stock idempotente.
  version: "1.0"

servers:
  - url: http://localhost:8080
    description: Local (docker compose)

tags:
  - name: Franquicias
  - name: Sucursales
  - name: Productos
  - name: Inventario
  - name: Consultas

paths:
  /api/franquicias:
    post:
      tags: [Franquicias]
      summary: Crear una franquicia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FranquiciaPeticion'
            examples:
              ejemplo:
                value:
                  nombre: "Franquicia Andina"
                  tipoDocumento: "NIT"
                  numeroDocumento: "900123456"
      responses:
        '201':
          description: Franquicia creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FranquiciaRespuesta'
        '409':
          description: Ya existe una franquicia con ese tipo y número de documento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  /api/franquicias/{franquiciaId}/sucursales:
    post:
      tags: [Sucursales]
      summary: Crear una sucursal dentro de una franquicia
      parameters:
        - $ref: '#/components/parameters/FranquiciaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SucursalPeticion'
            examples:
              ejemplo:
                value:
                  nombre: "Sucursal Centro"
                  codigo: "SUC-001"
      responses:
        '201':
          description: Sucursal creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SucursalRespuesta'
        '404':
          description: La franquicia no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '409':
          description: Ya existe una sucursal con ese código en la franquicia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  /api/sucursales/{sucursalId}/productos:
    post:
      tags: [Productos]
      summary: Crear un producto dentro de una sucursal
      parameters:
        - $ref: '#/components/parameters/SucursalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoPeticion'
            examples:
              ejemplo:
                value:
                  nombre: "Camiseta Basica"
                  codigo: "PRD-001"
                  stock: 50
      responses:
        '201':
          description: Producto creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoRespuesta'
        '404':
          description: La sucursal no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '409':
          description: Ya existe un producto con ese código en la sucursal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  /api/sucursales/{sucursalId}/productos/{productoId}:
    delete:
      tags: [Productos]
      summary: Eliminar un producto (borrado lógico)
      description: >
        No borra la fila; marca el producto como inactivo. El producto deja
        de aparecer en cualquier consulta de negocio, pero su código no se
        libera para reutilizarse.
      parameters:
        - $ref: '#/components/parameters/SucursalId'
        - $ref: '#/components/parameters/ProductoId'
      responses:
        '204':
          description: Producto eliminado
        '404':
          description: El producto no existe (o ya estaba eliminado, o pertenece a otra sucursal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  /api/productos/{productoId}/stock:
    patch:
      tags: [Inventario]
      summary: Aplicar un movimiento de stock (idempotente)
      description: >
        Actualiza el stock por delta relativo (positivo o negativo), no por
        valor absoluto. Requiere una Idempotency-Key: reenviar la misma key
        (mismo reintento de red) no vuelve a aplicar el delta.
      parameters:
        - $ref: '#/components/parameters/ProductoId'
        - name: Idempotency-Key
          in: header
          required: true
          description: Identificador único por intención de operación (no por intento HTTP).
          schema:
            type: string
        - name: X-Usuario
          in: header
          required: true
          description: Usuario que origina el movimiento (no hay autenticación aún).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarStockPeticion'
            examples:
              incremento:
                value: { delta: 5 }
              decremento:
                value: { delta: -10 }
      responses:
        '200':
          description: Stock actualizado (o resultado del movimiento ya procesado, si la key se repite)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoRespuesta'
        '400':
          description: Falta el header Idempotency-Key o X-Usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '404':
          description: El producto no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '409':
          description: El delta dejaría el stock en negativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  /api/franquicias/{franquiciaId}/productos/mayor-stock:
    get:
      tags: [Consultas]
      summary: Producto con mayor stock por cada sucursal de una franquicia
      parameters:
        - $ref: '#/components/parameters/FranquiciaId'
      responses:
        '200':
          description: Un producto por sucursal (la de mayor stock activo)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductoMayorStockPorSucursalRespuesta'
        '404':
          description: La franquicia no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

components:
  parameters:
    FranquiciaId:
      name: franquiciaId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SucursalId:
      name: sucursalId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ProductoId:
      name: productoId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    FranquiciaPeticion:
      type: object
      required: [nombre, tipoDocumento, numeroDocumento]
      properties:
        nombre:
          type: string
        tipoDocumento:
          type: string
          enum: [NIT, CC, CE]
        numeroDocumento:
          type: string

    FranquiciaRespuesta:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
        tipoDocumento:
          type: string
        numeroDocumento:
          type: string

    SucursalPeticion:
      type: object
      required: [nombre, codigo]
      properties:
        nombre:
          type: string
        codigo:
          type: string

    SucursalRespuesta:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
        codigo:
          type: string
        franquiciaId:
          type: integer
          format: int64

    ProductoPeticion:
      type: object
      required: [nombre, codigo, stock]
      properties:
        nombre:
          type: string
        codigo:
          type: string
        stock:
          type: integer

    ProductoRespuesta:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
        codigo:
          type: string
        stock:
          type: integer
        sucursalId:
          type: integer
          format: int64

    ActualizarStockPeticion:
      type: object
      required: [delta]
      properties:
        delta:
          type: integer
          description: Cantidad a sumar (positivo) o restar (negativo) al stock actual.

    ProductoMayorStockPorSucursalRespuesta:
      type: object
      properties:
        productoId:
          type: integer
          format: int64
        productoNombre:
          type: string
        stock:
          type: integer
        sucursalId:
          type: integer
          format: int64
        sucursalNombre:
          type: string

    ErrorRespuesta:
      type: object
      properties:
        fecha:
          type: string
          format: date-time
        estado:
          type: integer
        error:
          type: string
        mensaje:
          type: string
        ruta:
          type: string
