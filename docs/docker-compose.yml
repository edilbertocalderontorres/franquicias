name: franquicias

# Uso:
#   docker compose -f docs/docker-compose.yml up -d

services:
  postgres:
    image: postgres:16
    container_name: franquicias-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: franquicias
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d franquicias"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
